[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "weekglass"
version = "0.1.0"
description = "本地优先的日历碎片审计与专注计划：把一个或多个 .ics 日历变成一周的时间预算报告"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Weekglass contributors" }]
keywords = ["calendar", "ics", "focus", "time-blocking", "privacy", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "icalendar==7.3.0",
  "recurring-ical-events==3.8.2",
  "python-dateutil==2.9.0.post0",
  "Jinja2==3.1.6",
  "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
weekglass = "weekglass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weekglass"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
