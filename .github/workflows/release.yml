name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: verify, test, build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q

      - name: Build
        run: |
          python -m pip install build==1.3.0
          python -m build

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
